<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF5A1F">
  <meta name="description" content="Circle — eat where your real friends eat. No bots, no paid reels.">
  <title>Circle — eat where your friends eat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍛</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- bump ?v= after editing a file so phones don't keep the old cached copy -->
  <link rel="stylesheet" href="css/styles.css?v=11">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="logo" href="#/circle">circle<span>.</span></a>
      <span class="city">📍 Bangalore</span>
    </header>

    <main id="view"></main>

    <section id="map-view" class="map-view" hidden>
      <div id="map" class="map"></div>
      <div id="map-filters" class="map-filters"></div>
      <button class="locate-btn" data-action="locate" aria-label="Show my location">◎</button>
    </section>

    <button class="fab" data-action="rate">＋ Rate a place</button>

    <nav class="tabbar" aria-label="Main">
      <a href="#/circle" data-tab="circle"><span>👯</span>Circle</a>
      <a href="#/trending" data-tab="trending"><span>🔥</span>Trending</a>
      <a href="#/map" data-tab="map"><span>🗺️</span>Map</a>
      <a href="#/saved" data-tab="saved"><span>🔖</span>Want to Try</a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=11"></script>
  <script src="js/cloud.js?v=11"></script>
  <script src="js/seed.js?v=11"></script>
  <script src="js/store.js?v=11"></script>
  <script src="js/maps.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
