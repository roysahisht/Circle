# Checks every morning for a new Overture Maps release and, if there is one, rebuilds
# data/bangalore-places.json and commits it. If the site is hosted from this repo
# (GitHub Pages / Netlify / Vercel), the new list goes live automatically.
name: Refresh Bangalore places

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST daily
  workflow_dispatch: # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb
      - run: python scripts/fetch_places.py
      - name: Commit the new list (only if it changed)
        run: |
          if git diff --quiet -- data/; then
            echo "No new Overture release today."
            exit 0
          fi
          git config user.name "circle-bot"
          git config user.email "circle-bot@users.noreply.github.com"
          git add data/bangalore-places.json
          git commit -m "Refresh Bangalore places from latest Overture release"
          git push
